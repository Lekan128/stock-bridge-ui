# Netlify build configuration.
#
# Values here override the equivalents set in the Netlify UI, which is the
# point: build settings and per-environment API URLs live in the repo and
# change through review, not through a dashboard field nobody can diff.
#
# SPA routing is deliberately NOT configured here - `public/_redirects`
# already ships the `/* /index.html 200` rule into `dist/`, and duplicating
# it as a `[[redirects]]` block would mean two places to keep in sync.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Pin the toolchain so a Netlify default bump can't change build output
  # underneath us. Matches the Node LTS line used locally.
  NODE_VERSION = "22"

# `VITE_API_BASE_URL` is baked into the bundle at build time, not read at
# runtime - so each context has to be built against its own backend. There is
# no `[context.production.environment]` block on purpose: production's value
# stays where it already is (Netlify UI > Site configuration > Environment
# variables), so adding staging can't accidentally repoint the live site.

# The `staging` branch, deployed at https://staging--<site-name>.netlify.app.
# Requires branch deploys to be enabled for `staging` in the Netlify UI - see
# DEPLOYMENT.md. The URL below must be the *staging* Render service, and that
# service's own FRONTEND_ORIGIN must list this site's URL or every request
# from it fails CORS.
#
# Keep the `https://` scheme. axios reads a schemeless baseURL as a relative
# path, so it resolves against the Netlify origin - every call quietly goes to
# staging--<site>.netlify.app/staging-api.procurepaddy.com/... instead of the
# backend, with no error to explain why.
[context.staging.environment]
  VITE_API_BASE_URL = "https://staging-api.procurepaddy.com"
  # The landing page's canonical URL, sitemap and robots.txt (scripts/prerender.mjs). Staging tells
  # search engines to stay away entirely, so it never competes with procurepaddy.com in results.
  SITE_NOINDEX = "true"
  # Staging shows the founding-offer page for review (LANDING_PAGE_PLAN.md, step 3). Production keeps
  # the early-access page until the owners turn this on there, which the build refuses until the
  # founders are in src/marketing/founders.ts.
  VITE_FOUNDING_OFFER = "true"

# Pull request previews point at staging too. A preview is unreviewed code, so
# the failure mode of getting this wrong (writing to the production database
# from a branch that may never merge) is much worse than the inconvenience of
# previewing against staging data.
[context.deploy-preview.environment]
  VITE_API_BASE_URL = "https://staging-api.procurepaddy.com"
  SITE_NOINDEX = "true"

# --------------------------------------------------------------------------- Offline app shell
# The service worker and the files it decides with must never be served stale from an HTTP
# cache, or a deploy can't reach installed phones: the browser would keep comparing against an
# old sw.js and never see the new version. Netlify's default (max-age=0, must-revalidate) already
# behaves this way; it is stated here so a future default change can't quietly break updates.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

# The prerendered landing page changes with every deploy; never serve a stale copy at /.
[[headers]]
  for = "/landing.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/founding.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"
    Content-Type = "application/manifest+json"

# Everything under /assets/ is content-hashed by Vite, so a given URL never changes meaning.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
